<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transmisión en Vivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ═══════════════════════════════════════
       VARIABLES GLOBALES
       ═══════════════════════════════════════ */
    :root {
      /* Colores base: se actualizan desde Supabase por sitio */
      --primary: #020A35;
      --primary-dark: #01051A;
      --secondary: #020A35;
      --secondary-light: #1A237E;
      --success: #06d6a0;
      --danger: #ef476f;
      --warning: #ffd166;
      --dark: #01051A;
      --light: #f8f9fa;
      --gray: #6c757d;
      --white: #ffffff;
      --black: #000000;
      --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px rgba(0, 0, 0, 0.2);
      --border-radius: 12px;
      --border-radius-sm: 8px;
      --transition: all 0.3s ease;

      /* Variables dinámicas del sitio para envivo.html */
      --site-color-principal: #020A35;
      --site-color-principal-rgb: 2, 10, 53;
      --site-color-principal-oscuro: #01051A;
      --site-color-principal-medio: #1A237E;
      --site-color-acento: #020A35;
      --site-color-acento-claro: #1A237E;
      --site-color-acento-rgb: 2, 10, 53;
      --site-texto-sobre-acento: #ffffff;
      --site-panel-bg: #01051A;
      --site-panel-bg-2: #020A35;
      --site-video-bg: #000000;
      --site-chat-bg: #ffffff;
      --site-muted-text: rgba(255, 255, 255, 0.72);
      --site-soft-line: rgba(255, 255, 255, 0.12);
      --site-overlay-bg: rgba(2, 10, 53, 0.92);
      --site-gradient-bg: linear-gradient(135deg, #01051A 0%, #020A35 55%, #1A237E 100%);
      --site-gradient-panel: linear-gradient(145deg, #01051A, #020A35);
      --site-gradient-acento: linear-gradient(135deg, #020A35, #1A237E);
      --site-gradient-toast: linear-gradient(135deg, #01051A, #020A35);
      --site-live-color: var(--site-color-acento);
      --site-live-color-rgb: var(--site-color-acento-rgb);
    }

    /* Reset y estilos base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--site-gradient-bg);
      color: var(--white);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
   
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.15;
      z-index: -1;
    }

    /* ═══════════════════════════════════════
       CONTENEDOR PRINCIPAL
       ═══════════════════════════════════════ */
    #video-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90vw;
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ═══════════════════════════════════════
       HEADER / TÍTULO
       ═══════════════════════════════════════ */
    .live-header {
      text-align: center;
      margin-bottom: 25px;
      width: 100%;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--danger), var(--site-color-principal));
      color: var(--white);
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(var(--site-live-color-rgb), 0.4);
      animation: pulse-live 2s infinite;
      margin-bottom: 15px;
    }

    .live-badge::before {
      content: '';
      width: 10px;
      height: 10px;
      background: var(--white);
      border-radius: 50%;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes pulse-live {
      0% { box-shadow: 0 0 0 0 rgba(var(--site-live-color-rgb), 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(var(--site-live-color-rgb), 0); }
      100% { box-shadow: 0 0 0 0 rgba(var(--site-live-color-rgb), 0); }
    }

    .live-header h1 {
      font-size: 32px;
      font-weight: 800;
      color: var(--white);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      margin: 0;
    }

    .live-header p {
      color: var(--site-muted-text);
      font-size: 16px;
      margin-top: 8px;
    }

    /* ═══════════════════════════════════════
       VIDEO PLAYER
       ═══════════════════════════════════════ */
    .video-wrapper {
      width: 100%;
      background: var(--site-gradient-panel);
      border-radius: var(--border-radius);
      padding: 15px;
      box-shadow: var(--shadow-lg);
      border: 2px solid rgba(var(--site-color-acento-rgb), 0.35);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .video-wrapper::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 30%,
        rgba(var(--site-color-acento-rgb), 0.04) 50%,
        transparent 70%
      );
      animation: shine 6s infinite;
      pointer-events: none;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }

    #youtube-frame {
      width: 100%;
      height: 40vw;
      max-height: 560px;
      min-height: 300px;
      border: none;
      border-radius: var(--border-radius-sm);
      background: var(--site-video-bg);
    }

    /* ═══════════════════════════════════════
       CHAT CONTAINER
       ═══════════════════════════════════════ */
    .chat-wrapper {
      width: 100%;
      background: var(--site-gradient-panel);
      border-radius: var(--border-radius);
      padding: 15px;
      box-shadow: var(--shadow-lg);
      border: 2px solid rgba(var(--site-color-acento-rgb), 0.25);
      margin-bottom: 20px;
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--site-soft-line);
    }

    .chat-header-icon {
      font-size: 20px;
    }

    .chat-header h3 {
      margin: 0;
      font-size: 16px;
      color: var(--site-color-acento);
      font-weight: 600;
    }

    #youtube-chat {
      width: 100%;
      height: 380px;
      border: none;
      border-radius: var(--border-radius-sm);
      background: var(--site-chat-bg);
    }

    /* ═══════════════════════════════════════
       BOTÓN CHAT EXTERNO
       ═══════════════════════════════════════ */
    #chat-external {
      display: none;
      color: var(--site-texto-sobre-acento);
      margin: 12px 0 20px;
      background: var(--site-gradient-acento);
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 16px;
      text-decoration: none;
      font-weight: 700;
      box-shadow: var(--shadow-lg);
      transition: var(--transition);
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
    }

    #chat-external:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(var(--site-color-acento-rgb), 0.5);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(var(--site-color-acento-rgb), 0.7); }
      70% { box-shadow: 0 0 0 15px rgba(var(--site-color-acento-rgb), 0); }
      100% { box-shadow: 0 0 0 0 rgba(var(--site-color-acento-rgb), 0); }
    }

    /* ═══════════════════════════════════════
       REDES SOCIALES
       ═══════════════════════════════════════ */
    #redes-sociales {
      display: flex;
      gap: 20px;
      justify-content: center;
      padding: 12px 25px;
      background: var(--site-gradient-acento);
      border-radius: 50px;
      box-shadow: var(--shadow-lg);
      margin-top: 10px;
    }

    #redes-sociales a {
      color: var(--site-texto-sobre-acento);
      font-size: 24px;
      transition: var(--transition);
      text-decoration: none;
    }

    #redes-sociales a:hover {
      transform: translateY(-5px) scale(1.2);
    }

    /* ═══════════════════════════════════════
       COHETES / EFECTOS
       ═══════════════════════════════════════ */
    #cohetesGif {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://i.gifer.com/4M57.gif') center center no-repeat;
      background-size: cover;
      z-index: 9999;
      pointer-events: none;
    }

    /* ═══════════════════════════════════════
       TOAST NOTIFICATIONS
       ═══════════════════════════════════════ */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--site-gradient-toast);
      color: var(--white);
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      z-index: 10000;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      opacity: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .toast.mostrar {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success {
      background: linear-gradient(135deg, var(--success), var(--site-color-principal));
    }

    .toast.error {
      background: linear-gradient(135deg, var(--danger), var(--site-color-principal));
    }

    /* ═══════════════════════════════════════
       LOADING SPINNER
       ═══════════════════════════════════════ */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--site-overlay-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9998;
      backdrop-filter: blur(10px);
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(var(--site-color-acento-rgb), 0.2);
      border-top-color: var(--site-color-acento);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      margin-top: 20px;
      color: var(--white);
      font-size: 16px;
      font-weight: 600;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ═══════════════════════════════════════
       ERROR STATE
       ═══════════════════════════════════════ */
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .error-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .error-container h2 {
      color: var(--white);
      font-size: 28px;
      margin-bottom: 10px;
    }

    .error-container p {
      color: var(--site-muted-text);
      font-size: 16px;
      max-width: 400px;
    }

    /* ═══════════════════════════════════════
       SCROLLBAR PERSONALIZADA
       ═══════════════════════════════════════ */
    ::-webkit-scrollbar {
      width: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--site-soft-line);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--site-gradient-acento);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--site-gradient-acento);
    }

    /* ═══════════════════════════════════════
       MEDIA QUERY PARA MÓVILES
       ═══════════════════════════════════════ */
    @media (max-width: 768px) {
      #video-container {
        width: 100vw;
        max-width: none;
        padding: 15px 10px;
      }

      .live-header h1 {
        font-size: 24px;
      }

      .video-wrapper,
      .chat-wrapper {
        padding: 10px;
        border-radius: var(--border-radius-sm);
      }

      #youtube-frame {
        height: 55vw;
        max-height: 280px;
        min-height: 200px;
        border-radius: 8px;
      }

      #youtube-chat {
        height: 320px;
        min-height: 200px;
        border-radius: 8px;
      }

      #chat-external {
        display: inline-flex;
        width: 90%;
        justify-content: center;
      }

      #redes-sociales {
        padding: 10px 20px;
        gap: 15px;
      }

      #redes-sociales a {
        font-size: 20px;
      }
    }

    @media (max-width: 480px) {
      .live-header h1 {
        font-size: 20px;
      }

      .live-badge {
        font-size: 12px;
        padding: 6px 16px;
      }

      #youtube-frame {
        height: 50vw;
        min-height: 180px;
      }
    }

    /* ═══════════════════════════════════════
       CAPA FINAL: COLORES 100% DINÁMICOS DEL SITIO
       Esta capa evita que colores viejos/fijos tapen la configuración del panel.
       ═══════════════════════════════════════ */
    body {
      background: var(--site-gradient-bg) !important;
    }

    .video-wrapper,
    .chat-wrapper {
      background: var(--site-gradient-panel) !important;
      border-color: rgba(var(--site-color-acento-rgb), 0.35) !important;
    }

    .video-wrapper::before {
      background: linear-gradient(
        45deg,
        transparent 30%,
        rgba(var(--site-color-acento-rgb), 0.05) 50%,
        transparent 70%
      ) !important;
    }

    .chat-header h3,
    .live-header h1 {
      color: var(--white) !important;
    }

    .chat-header {
      border-bottom-color: var(--site-soft-line) !important;
    }

    #chat-external,
    #redes-sociales {
      background: var(--site-gradient-acento) !important;
      color: var(--site-texto-sobre-acento) !important;
    }

    #chat-external,
    #redes-sociales a {
      color: var(--site-texto-sobre-acento) !important;
    }

    .live-badge {
      background: linear-gradient(135deg, var(--site-live-color), var(--site-color-principal)) !important;
      box-shadow: 0 4px 15px rgba(var(--site-live-color-rgb), 0.4) !important;
    }

    .spinner {
      border-color: rgba(var(--site-color-acento-rgb), 0.22) !important;
      border-top-color: var(--site-color-acento) !important;
    }

    .loading-overlay {
      background: var(--site-overlay-bg) !important;
    }

    ::-webkit-scrollbar-thumb,
    ::-webkit-scrollbar-thumb:hover {
      background: var(--site-gradient-acento) !important;
    }

    .aviso-envivo-error {
      background: var(--site-chat-bg) !important;
      color: var(--black) !important;
      border: 1px solid rgba(var(--site-color-acento-rgb), 0.35) !important;
      border-radius: 12px;
      padding: 16px;
      margin: 20px auto;
      max-width: 700px;
      text-align: center;
    }

  </style>

  <div id="video-container">

    <div class="live-header">

    <!-- Botón externo para móvil -->

    <!-- Redes Sociales -->

  <!-- Efecto Cohetes -->

  <!-- Audio -->

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ==================== CONFIG SUPABASE PRINCIPAL ====================
    const supabaseUrl = 'https://zxtgaovreqzcpzdvmmcx.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4dGdhb3ZyZXF6Y3B6ZHZtbWN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1NzUwOTUsImV4cCI6MjA5NzE1MTA5NX0.aUqskDkosOTXmWOm0q0RacgAnQezSxVD2wGB6CXOB3g';

    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    let SITE_SLUG = 'golden';
    let SITE_ID = null;
    let sitioActual = null;

    function mostrarToast(mensaje, tipo = 'info') {
      const toast = document.getElementById('toast');
      if (!toast) return;

      toast.textContent = mensaje;
      toast.className = `toast ${tipo} mostrar`;

      setTimeout(() => {
        toast.classList.remove('mostrar');
      }, 3000);
    }

    function obtenerSlugSitio() {
      const params = new URLSearchParams(window.location.search);
      const slugUrl = params.get('site');

      if (slugUrl && slugUrl.trim()) {
        return slugUrl.trim().toLowerCase();
      }

      // Si viene desde index.html?site=cliente, intenta heredar ese slug
      try {
        if (document.referrer) {
          const ref = new URL(document.referrer);
          const slugRef = ref.searchParams.get('site');

          if (slugRef && slugRef.trim()) {
            return slugRef.trim().toLowerCase();
          }
        }
      } catch (error) {
        console.warn('No se pudo leer slug desde referrer:', error);
      }

      return 'golden';
    }

    function sitioEstaNoDisponible(sitio) {
      if (!sitio) return true;

      if (sitio.estado && String(sitio.estado).toLowerCase() !== 'activo') {
        return true;
      }

      if (sitio.activo === false) {
        return true;
      }

      if (
        sitio.dias_restantes !== null &&
        sitio.dias_restantes !== undefined &&
        sitio.dias_restantes !== ''
      ) {
        return Number(sitio.dias_restantes) <= 0;
      }

      return false;
    }

    function mostrarErrorPantalla(titulo, mensaje) {
      const loading = document.getElementById('loading');

      if (loading) {
        loading.innerHTML = `
          <div class="error-container">
            <div class="error-icon">⚠️</div>
            <h2>${titulo}</h2>
            <p>${mensaje}</p>
          </div>
        `;
        loading.style.display = 'flex';
        loading.style.opacity = '1';
      }
    }

    function ocultarLoading() {
      const loading = document.getElementById('loading');
      if (!loading) return;

      loading.style.opacity = '0';
      loading.style.transition = 'opacity 0.5s ease';

      setTimeout(() => {
        loading.style.display = 'none';
      }, 500);
    }

    function envivoNormalizarHex(color, fallback = '#020A35') {
      color = String(color || '').trim();

      if (!color) return fallback;
      if (!color.startsWith('#')) color = '#' + color;

      if (/^#([0-9A-F]{3})$/i.test(color)) {
        const r = color[1];
        const g = color[2];
        const b = color[3];
        color = `#${r}${r}${g}${g}${b}${b}`;
      }

      if (!/^#([0-9A-F]{6})$/i.test(color)) {
        return fallback;
      }

      return color.toUpperCase();
    }

    function envivoHexARgb(color, fallback = '#020A35') {
      color = envivoNormalizarHex(color, fallback).replace('#', '');
      const r = parseInt(color.slice(0, 2), 16);
      const g = parseInt(color.slice(2, 4), 16);
      const b = parseInt(color.slice(4, 6), 16);
      return { r, g, b };
    }

    function envivoRgbTexto(color, fallback = '#020A35') {
      const { r, g, b } = envivoHexARgb(color, fallback);
      return `${r}, ${g}, ${b}`;
    }

    function envivoAjustarColor(color, porcentaje) {
      const { r, g, b } = envivoHexARgb(color);
      const ajustar = (valor) => {
        const nuevo = porcentaje < 0
          ? valor * (1 + porcentaje / 100)
          : valor + (255 - valor) * (porcentaje / 100);

        return Math.max(0, Math.min(255, Math.round(nuevo)));
      };

      return '#' + [ajustar(r), ajustar(g), ajustar(b)]
        .map(v => v.toString(16).padStart(2, '0'))
        .join('')
        .toUpperCase();
    }

    function envivoLuminancia(color) {
      const { r, g, b } = envivoHexARgb(color);
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    }

    function envivoTextoContraste(color) {
      return envivoLuminancia(color) > 0.62 ? '#111111' : '#FFFFFF';
    }

    function aplicarColorPrincipalEnvivo(sitio) {
      // Toma el color guardado del sitio y lo convierte en TODO el tema de envivo.html.
      // Así ningún color fijo del diseño anterior tapa la configuración del panel.
      const colorPrincipal = envivoNormalizarHex(sitio?.color_principal, '#020A35');

      // Si el sitio tiene color secundario, se usa como acento.
      // Si no tiene, el acento sale del mismo color principal para evitar colores fijos.
      const colorAcento = envivoNormalizarHex(
        sitio?.color_secundario || sitio?.color_acento || sitio?.color_principal,
        colorPrincipal
      );

      const colorPrincipalOscuro = envivoAjustarColor(colorPrincipal, -55);
      const colorPrincipalMedio = envivoAjustarColor(colorPrincipal, -25);
      const colorAcentoClaro = envivoAjustarColor(colorAcento, 22);
      const colorAcentoOscuro = envivoAjustarColor(colorAcento, -18);
      const textoSobreAcento = envivoTextoContraste(colorAcento);
      const principalRgb = envivoRgbTexto(colorPrincipal);
      const acentoRgb = envivoRgbTexto(colorAcento);

      const root = document.documentElement;

      root.style.setProperty('--primary', colorPrincipal);
      root.style.setProperty('--primary-dark', colorPrincipalMedio);
      root.style.setProperty('--dark', colorPrincipalOscuro);
      root.style.setProperty('--secondary', colorAcento);
      root.style.setProperty('--secondary-light', colorAcentoClaro);

      root.style.setProperty('--site-color-principal', colorPrincipal);
      root.style.setProperty('--site-color-principal-rgb', principalRgb);
      root.style.setProperty('--site-color-principal-oscuro', colorPrincipalOscuro);
      root.style.setProperty('--site-color-principal-medio', colorPrincipalMedio);
      root.style.setProperty('--site-color-acento', colorAcento);
      root.style.setProperty('--site-color-acento-claro', colorAcentoClaro);
      root.style.setProperty('--site-color-acento-rgb', acentoRgb);
      root.style.setProperty('--site-texto-sobre-acento', textoSobreAcento);

      root.style.setProperty('--site-panel-bg', colorPrincipalOscuro);
      root.style.setProperty('--site-panel-bg-2', colorPrincipalMedio);
      root.style.setProperty('--site-overlay-bg', `rgba(${principalRgb}, 0.92)`);
      root.style.setProperty('--site-gradient-bg', `linear-gradient(135deg, ${colorPrincipalOscuro} 0%, ${colorPrincipalMedio} 55%, ${colorPrincipal} 100%)`);
      root.style.setProperty('--site-gradient-panel', `linear-gradient(145deg, ${colorPrincipalOscuro}, ${colorPrincipalMedio})`);
      root.style.setProperty('--site-gradient-acento', `linear-gradient(135deg, ${colorAcentoOscuro}, ${colorAcentoClaro})`);
      root.style.setProperty('--site-gradient-toast', `linear-gradient(135deg, ${colorPrincipalOscuro}, ${colorPrincipalMedio})`);
      root.style.setProperty('--site-live-color', colorAcento);
      root.style.setProperty('--site-live-color-rgb', acentoRgb);

      // Limpia cualquier estilo inline anterior y aplica el tema dinámico.
      document.body.style.background = '';
      document.querySelectorAll('.video-wrapper, .chat-wrapper').forEach(el => {
        el.style.borderColor = '';
        el.style.background = '';
      });
    }

    async function cargarSitioActual() {
      SITE_SLUG = obtenerSlugSitio();

      const { data, error } = await supabaseClient.rpc('rpc_public_get_sitio', {
        _slug: SITE_SLUG
      });

      if (error) {
        console.error('Error cargando sitio:', error);
        throw new Error('No se pudo cargar este sitio.');
      }

      const sitio = Array.isArray(data) ? data[0] : data;

      if (!sitio) {
        throw new Error('Este sitio no existe.');
      }

      if (sitioEstaNoDisponible(sitio)) {
        throw new Error('Este sitio está pausado o vencido.');
      }

      sitioActual = sitio;
      SITE_ID = sitio.id;

      aplicarColorPrincipalEnvivo(sitio);

      document.title = `${sitio.nombre || 'Bingo'} - En Vivo`;

      const titulo = document.querySelector('.live-header h1');
      if (titulo) titulo.textContent = `Transmisión en Vivo`;

      const subtitulo = document.querySelector('.live-header p');
      if (subtitulo) subtitulo.textContent = sitio.nombre ? `Sitio: ${sitio.nombre}` : '¡Únete a la conversación en el chat!';

      // El color del sitio ya fue aplicado por aplicarColorPrincipalEnvivo(sitio).

      return sitio;
    }

    function extraerIDYoutube(link) {
      try {
        const url = new URL(link);

        if (url.hostname.includes('youtu.be')) {
          return url.pathname.replace('/', '').split('?')[0];
        }

        if (url.searchParams.get('v')) {
          return url.searchParams.get('v');
        }

        const partes = url.pathname.split('/').filter(Boolean);

        // youtube.com/live/ID
        const liveIndex = partes.indexOf('live');
        if (liveIndex >= 0 && partes[liveIndex + 1]) {
          return partes[liveIndex + 1];
        }

        // youtube.com/embed/ID
        const embedIndex = partes.indexOf('embed');
        if (embedIndex >= 0 && partes[embedIndex + 1]) {
          return partes[embedIndex + 1];
        }

        return null;
      } catch {
        return null;
      }
    }

    async function cargarLinkYoutubeSitio() {
      if (!SITE_ID) {
        throw new Error('No se pudo identificar el sitio actual.');
      }

      // Esta RPC lee solo el link youtube_live del sitio actual.
      const { data, error } = await supabaseClient.rpc('rpc_public_youtube_live', {
        _site_id: SITE_ID
      });

      if (error) {
        console.error('Error cargando YouTube Live:', error);
        throw new Error('No se pudo cargar la configuración del video.');
      }

      const link = typeof data === 'string' ? data.trim() : '';

      if (!link) {
        throw new Error('Este sitio todavía no tiene un enlace de YouTube configurado.');
      }

      return link;
    }

    async function cargarVideo() {
      const linkYoutube = await cargarLinkYoutubeSitio();
      const id = extraerIDYoutube(linkYoutube);
      const dominio = location.hostname;

      if (!id) {
        throw new Error('El enlace de YouTube no es válido.');
      }

      const frame = document.getElementById('youtube-frame');
      const chat = document.getElementById('youtube-chat');
      const chatExternal = document.getElementById('chat-external');

      if (frame) {
        frame.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
      }

      if (chat) {
        chat.src = `https://www.youtube.com/live_chat?v=${id}&embed_domain=${dominio}`;
      }

      if (chatExternal) {
        chatExternal.href = `https://www.youtube.com/live_chat?v=${id}`;
      }

      ocultarLoading();
      mostrarToast('¡Transmisión cargada con éxito!', 'success');
    }

    function ajustarChatMobile() {
      const chatWrapper = document.getElementById('chat-wrapper');
      const chatExternal = document.getElementById('chat-external');

      if (!chatWrapper || !chatExternal) return;

      if (window.innerWidth < 768) {
        chatWrapper.style.display = 'none';
        chatExternal.style.display = 'inline-flex';
      } else {
        chatWrapper.style.display = 'block';
        chatExternal.style.display = 'none';
      }
    }

    let ultimoCoheteProcesado = '';

    async function mostrarCohetes(valorEvento = '') {
      const valorActual = String(valorEvento || 'true');

      // Evita procesar el mismo evento dos veces.
      if (valorActual && valorActual === ultimoCoheteProcesado) return;
      ultimoCoheteProcesado = valorActual;

      const gif = document.getElementById('cohetesGif');
      const sonido = document.getElementById('sonidoCohetes');

      if (gif) gif.style.display = 'block';
      mostrarToast('🎉 ¡Cohetes activados!', 'success');

      try {
        if (sonido) {
          sonido.currentTime = 0;
          await sonido.play();
        }
      } catch (error) {
        console.warn('Sonido bloqueado por navegador:', error);
      }

      setTimeout(async () => {
        if (gif) gif.style.display = 'none';

        if (sonido) {
          sonido.pause();
          sonido.currentTime = 0;
        }

        // Intenta apagarlo solo para este sitio. Si RLS no permite update público, no rompe la página.
        try {
          await supabaseClient
            .from('configuracion')
            .update({ valore: 'false' })
            .eq('site_id', SITE_ID)
            .eq('clave', 'cohetes_activados');
        } catch (error) {
          console.warn('No se pudo apagar cohetes_activados desde público:', error);
        }
      }, 12000);
    }

    let intervaloCohetesPublico = null;

    async function leerCohetesPublico() {
      if (!SITE_ID) return;

      try {
        const { data, error } = await supabaseClient.rpc('rpc_public_get_cohetes_estado', {
          _site_id: SITE_ID
        });

        if (error) {
          console.warn('No se pudo leer cohetes por RPC pública:', error);
          return;
        }

        const valorTexto = String(data || '').toLowerCase().trim();

        if (valorTexto === 'true' || valorTexto.startsWith('true:')) {
          await mostrarCohetes(valorTexto);
        }
      } catch (error) {
        console.warn('Error leyendo cohetes:', error);
      }
    }

    function activarCohetesRealtime() {
      // Versión corregida: ya no dependemos de Supabase Realtime.
      // Realtime puede fallar si RLS/publicación/cache no entregan el evento al público.
      // Esta página consulta una RPC pública segura cada 1.5 segundos.
      if (!SITE_ID) return;

      if (intervaloCohetesPublico) {
        clearInterval(intervaloCohetesPublico);
      }

      leerCohetesPublico();
      intervaloCohetesPublico = setInterval(leerCohetesPublico, 1500);
      console.log('Cohetes público por polling activo para site:', SITE_ID);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        await cargarSitioActual();

        // IMPORTANTE: activar los cohetes apenas se conoce el SITE_ID.
        // Ahora usa una RPC pública por intervalo, no depende de Realtime.
        activarCohetesRealtime();

        await cargarVideo();

        ajustarChatMobile();
        window.addEventListener('resize', ajustarChatMobile);
      } catch (error) {
        console.error('Error en envivo:', error);

        // Aunque falle el video, dejamos la página viva para que los cohetes puedan escucharse.
        const loading = document.getElementById('loading');
        if (loading) loading.style.display = 'none';

        mostrarToast(error.message || 'No se pudo cargar la transmisión.', 'error');

        const frame = document.getElementById('youtube-frame');
        if (frame) frame.style.display = 'none';

        const contenedor = document.getElementById('video-container');
        if (contenedor) {
          const aviso = document.createElement('div');
          aviso.className = 'aviso-envivo-error';
          aviso.innerHTML = `⚠️ ${error.message || 'No se pudo cargar la transmisión.'}<br><small>La página sigue escuchando los cohetes del panel admin.</small>`;
          contenedor.prepend(aviso);
        }
      }
    });
  </script>
