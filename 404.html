<body>
  <div class="box">
    <div class="logo">GP</div>
    <h1>Abriendo tu bingo...</h1>
    <p>Estamos cargando la página solicitada.</p>
  </div>

  <script>
    (function () {
      const origen = window.location.origin;
      const pathname = window.location.pathname || '/';
      const search = window.location.search || '';
      const hash = window.location.hash || '';

      let partes = pathname
        .split('/')
        .map(p => p.trim())
        .filter(Boolean);

      // Si el sitio está publicado en un subdirectorio de GitHub Pages,
      // intenta usar el último segmento como slug.
      let slug = partes.length ? partes[partes.length - 1] : '';
      slug = decodeURIComponent(slug).toLowerCase().trim();

      // Evita redirigir archivos reales o rutas técnicas si algo falla.
      const rutasReservadas = [
        'index.html',
        'bingo.html',
        'master.html',
        'envivo.html',
        '404.html',
        'styles.css',
        'script.js',
        'master.js'
      ];

      const pareceArchivo = /\.[a-z0-9]{2,8}$/i.test(slug);
      const esReservada = rutasReservadas.includes(slug);

      if (!slug || pareceArchivo || esReservada) {
        window.location.replace(origen + '/index.html');
        return;
      }

      // Convierte:
      // https://bingogp.com/bingolike
      // en:
      // https://bingogp.com/bingo.html?site=bingolike
      // También conserva el hash si existe:
      // https://bingogp.com/bingolike#cartones
      // en:
      // https://bingogp.com/bingo.html?site=bingolike#cartones
      const destino = origen + '/bingo.html?site=' + encodeURIComponent(slug) + hash;
      window.location.replace(destino);
    })();
  </script>
</body>
</html>
